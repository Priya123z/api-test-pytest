[pytest]
addopts = -v --tb=short -p no:warnings
testpaths = tests
markers =
    smoke: critical path only, the subset you run on every commit
    auth: login and token tests
    users: user CRUD tests
# There was a "regression" marker here too. Nothing used it, so
# `pytest -m regression` collected zero tests while the README advertised it.
# A marker that means "all of them" is the same as no marker, and plain `pytest`
# is the full run, and `-m "not smoke"` is everything else.
